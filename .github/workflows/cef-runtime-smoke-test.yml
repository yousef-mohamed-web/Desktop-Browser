              $rendererWs=[math]::Round((($samples|Measure-Object RendererWS -Average).Average)/1MB,1)
              $rendererPrivate=[math]::Round((($samples|Measure-Object RendererPrivate -Average).Average)/1MB,1)
              $maxCount=[int](($samples|Measure-Object Count -Maximum).Maximum)
              $edgeSummary += ""; $edgeSummary += "URL: $($case.Url)"
              $edgeSummary += "Startup to visible window: $startupMs ms"
              $edgeSummary += "Edge Navigation Timing load event: $loadMs ms"
              $edgeSummary += "Browser process-tree working set: average=$avgWs MB; peak=$peakWs MB"
              $edgeSummary += "Browser process-tree private bytes: average=$avgPrivate MB; peak=$peakPrivate MB"
              $edgeSummary += "Renderer-only memory: working_set_avg=$rendererWs MB; private_bytes_avg=$rendererPrivate MB"
