name: Desktop Browser - Windows Runtime Performance Test

on:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: "Successful CEF host build run ID containing the timing instrumentation"
        required: true
        default: ""
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: desktop-browser-runtime-smoke-test
  cancel-in-progress: false

jobs:
  runtime-performance-test:
    name: Measure startup and page load (Windows x64)
    runs-on: windows-2022
    timeout-minutes: 90

    steps:
      - name: Check out project
        uses: actions/checkout@v4

      - name: Download browser build artifact
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $sourceRunId = "${{ inputs.source_run_id }}"
          if ($sourceRunId -notmatch '^\d+$') { throw "source_run_id must be numeric." }
          $artifactDir = Join-Path $env:RUNNER_TEMP "DesktopBrowserArtifact"
          New-Item -ItemType Directory -Force -Path $artifactDir | Out-Null
          gh run download $sourceRunId --repo "${{ github.repository }}" --name "desktop-browser-cef-host-x64" --dir $artifactDir
          if ($LASTEXITCODE -ne 0) { throw "Could not download browser build artifact from run $sourceRunId." }
          foreach ($name in @("DesktopBrowser.exe", "DesktopBrowser.dll", "libcef.dll")) {
            if (-not (Test-Path (Join-Path $artifactDir $name))) { throw "Missing required file: $name" }
          }
          "BROWSER_DIR=$artifactDir" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Install Google Chrome, Zen Browser and GeckoDriver
        shell: pwsh
        timeout-minutes: 15
        run: |
          $ErrorActionPreference = "Stop"
          choco install googlechrome -y --no-progress
          if ($LASTEXITCODE -ne 0) { throw "Google Chrome installation failed." }
          choco install zen-browser -y --no-progress
          if ($LASTEXITCODE -ne 0) { throw "Zen Browser installation failed." }
          choco install geckodriver -y --no-progress
          if ($LASTEXITCODE -ne 0) { throw "GeckoDriver installation failed." }
          $chromeCandidates = @(
            "$env:ProgramFiles\Google\Chrome\Application\chrome.exe",
            "${env:ProgramFiles(x86)}\Google\Chrome\Application\chrome.exe"
          )
          $chromeExe = $chromeCandidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $chromeExe) { throw "Google Chrome executable was not found after installation." }
          $zenCandidates = @(
            "$env:ProgramFiles\Zen Browser\zen.exe",
            "${env:ProgramFiles(x86)}\Zen Browser\zen.exe",
            "$env:LOCALAPPDATA\Programs\Zen Browser\zen.exe",
            "$env:LOCALAPPDATA\Zen Browser\zen.exe"
          )
          $zenExe = $zenCandidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $zenExe) {
            $zenExe = Get-ChildItem "$env:ProgramFiles" -Filter "zen.exe" -Recurse -ErrorAction SilentlyContinue |
              Select-Object -First 1 -ExpandProperty FullName
          }
          if (-not $zenExe) { throw "Zen Browser executable was not found after installation." }
          "CHROME_EXE=$chromeExe" | Out-File -FilePath $env:GITHUB_ENV -Append
          "ZEN_EXE=$zenExe" | Out-File -FilePath $env:GITHUB_ENV -Append
          Write-Host "Chrome: $chromeExe"
          Write-Host "Zen: $zenExe"
          Write-Host "GeckoDriver: $((Get-Command geckodriver).Source)"

      - name: Launch browser and measure startup and page loading
        shell: pwsh
        timeout-minutes: 25
        run: |
          $ErrorActionPreference = "Stop"
          $helper = @'
          using System;
          using System.IO;
          using System.Runtime.InteropServices;

          public static class WindowCapture {
            public delegate bool EnumWindowsProc(IntPtr hwnd, IntPtr lParam);
            [DllImport("user32.dll")] static extern bool EnumWindows(EnumWindowsProc callback, IntPtr lParam);
            [DllImport("user32.dll")] static extern uint GetWindowThreadProcessId(IntPtr hwnd, out uint processId);
            [DllImport("user32.dll")] public static extern bool IsWindow(IntPtr hwnd);
            [DllImport("user32.dll")] static extern bool IsWindowVisible(IntPtr hwnd);
            [DllImport("user32.dll")] public static extern bool SetForegroundWindow(IntPtr hwnd);
            [DllImport("user32.dll")] public static extern bool GetWindowRect(IntPtr hwnd, out RECT rect);
            [DllImport("user32.dll")] static extern IntPtr GetWindowDC(IntPtr hwnd);
            [DllImport("user32.dll")] static extern int ReleaseDC(IntPtr hwnd, IntPtr hdc);
            [DllImport("gdi32.dll")] static extern IntPtr CreateCompatibleDC(IntPtr hdc);
            [DllImport("gdi32.dll")] static extern IntPtr CreateCompatibleBitmap(IntPtr hdc, int width, int height);
            [DllImport("gdi32.dll")] static extern IntPtr SelectObject(IntPtr hdc, IntPtr obj);
            [DllImport("gdi32.dll")] static extern bool BitBlt(IntPtr dst, int x, int y, int width, int height, IntPtr src, int srcX, int srcY, uint rop);
            [DllImport("gdi32.dll")] static extern int GetDIBits(IntPtr hdc, IntPtr bitmap, uint start, uint lines, IntPtr bits, IntPtr info, uint usage);
            [DllImport("gdi32.dll")] static extern bool DeleteObject(IntPtr obj);
            [DllImport("gdi32.dll")] static extern bool DeleteDC(IntPtr hdc);
            [StructLayout(LayoutKind.Sequential)] public struct RECT { public int Left; public int Top; public int Right; public int Bottom; }

            public static IntPtr FindVisibleWindowForProcess(uint pid) {
              IntPtr found = IntPtr.Zero;
              EnumWindows(delegate(IntPtr hwnd, IntPtr state) {
                uint owner;
                GetWindowThreadProcessId(hwnd, out owner);
                if (owner == pid && IsWindowVisible(hwnd)) { found = hwnd; return false; }
                return true;
              }, IntPtr.Zero);
              return found;
            }

            public static void Save(IntPtr hwnd, string path) {
              RECT r;
              if (!GetWindowRect(hwnd, out r)) throw new Exception("GetWindowRect failed.");
              int width = r.Right-r.Left, height = r.Bottom-r.Top;
              if (width < 200 || height < 150) throw new Exception("Invalid window dimensions.");
              IntPtr screen = GetWindowDC(IntPtr.Zero), memory = IntPtr.Zero, bitmap = IntPtr.Zero, old = IntPtr.Zero, info = IntPtr.Zero, pixelsPtr = IntPtr.Zero;
              if (screen == IntPtr.Zero) throw new Exception("GetWindowDC failed.");
              try {
                memory = CreateCompatibleDC(screen); bitmap = CreateCompatibleBitmap(screen,width,height);
                if (memory == IntPtr.Zero || bitmap == IntPtr.Zero) throw new Exception("GDI allocation failed.");
                old = SelectObject(memory,bitmap);
                if (!BitBlt(memory,0,0,width,height,screen,r.Left,r.Top,0x00CC0020)) throw new Exception("BitBlt failed.");
                int stride=((width*3+3)/4)*4, bytes=stride*height;
                info=Marshal.AllocHGlobal(40); for(int i=0;i<40;i++) Marshal.WriteByte(info,i,0);
                Marshal.WriteInt32(info,0,40); Marshal.WriteInt32(info,4,width); Marshal.WriteInt32(info,8,-height);
                Marshal.WriteInt16(info,12,1); Marshal.WriteInt16(info,14,24); Marshal.WriteInt32(info,20,bytes);
                pixelsPtr=Marshal.AllocHGlobal(bytes);
                if(GetDIBits(memory,bitmap,0,(uint)height,pixelsPtr,info,0)==0) throw new Exception("GetDIBits failed.");
                byte[] pixels=new byte[bytes]; Marshal.Copy(pixelsPtr,pixels,0,bytes);
                using(FileStream fs=new FileStream(path,FileMode.Create,FileAccess.Write)) {
                  byte[] header=new byte[14]; header[0]=0x42; header[1]=0x4D;
                  BitConverter.GetBytes(54+bytes).CopyTo(header,2); BitConverter.GetBytes(54).CopyTo(header,10);
                  fs.Write(header,0,14); byte[] dib=new byte[40]; Marshal.Copy(info,dib,0,40);
                  fs.Write(dib,0,40); fs.Write(pixels,0,pixels.Length);
                }
              } finally {
                if(pixelsPtr!=IntPtr.Zero) Marshal.FreeHGlobal(pixelsPtr);
                if(info!=IntPtr.Zero) Marshal.FreeHGlobal(info);
                if(old!=IntPtr.Zero && memory!=IntPtr.Zero) SelectObject(memory,old);
                if(bitmap!=IntPtr.Zero) DeleteObject(bitmap);
                if(memory!=IntPtr.Zero) DeleteDC(memory);
                ReleaseDC(IntPtr.Zero,screen);
              }
            }
          }
          '@
          Add-Type -TypeDefinition $helper -ReferencedAssemblies "System.dll"

          $evidence = Join-Path $env:RUNNER_TEMP "DesktopBrowserPerformanceEvidence"
          New-Item -ItemType Directory -Force -Path $evidence | Out-Null
          "EVIDENCE_DIR=$evidence" | Out-File -FilePath $env:GITHUB_ENV -Append
          $exe = Join-Path $env:BROWSER_DIR "DesktopBrowser.exe"
          $cases = @(
            @{ Name="example"; Url="https://example.com/" },
            @{ Name="wikipedia"; Url="https://www.wikipedia.org/" },
            @{ Name="chatgpt"; Url="https://chatgpt.com/" },
            @{ Name="github"; Url="https://github.com/" },
            @{ Name="claude"; Url="https://claude.com/" }
          )
          $summary = @(
            "Desktop Browser runtime performance test",
            "Runner: Windows Server 2022 x64 (GitHub-hosted; not a low-end PC benchmark)",
            "Startup metric: process launch to first visible top-level window owned by the browser process.",
            "Page-load metric: CEF main-frame OnLoadStart to OnLoadEnd callback.",
            "Sites: example.com (baseline), wikipedia.org (existing reference), chatgpt.com, github.com, claude.com.",
            "Dynamic services are tested logged out; login, bot checks, consent prompts, or network challenges may affect results. These are page-load tests, not authenticated app-task tests.",
            "Memory metrics: browser process tree (main + all descendant CEF/Chromium processes), renderer-only subtotal, working set and private bytes.",
            "Memory sampling: five 1-second samples after page load; report average and peak. This is whole-app memory, not a tab-only estimate."
          )
          function Get-BrowserProcessTree([int]$RootPid) {
            $all = @(Get-CimInstance Win32_Process)
            $ids = [System.Collections.Generic.HashSet[int]]::new()
            [void]$ids.Add($RootPid)
            $changed = $true
            while ($changed) {
              $changed = $false
              foreach ($p in $all) {
                if ($ids.Contains([int]$p.ParentProcessId) -and -not $ids.Contains([int]$p.ProcessId)) {
                  [void]$ids.Add([int]$p.ProcessId)
                  $changed = $true
                }
              }
            }
            $rows = foreach ($p in $all) {
              if ($ids.Contains([int]$p.ProcessId)) {
                $g = Get-Process -Id $p.ProcessId -ErrorAction SilentlyContinue
                if ($g) {
                  [pscustomobject]@{
                    Pid = [int]$p.ProcessId
                    ParentPid = [int]$p.ParentProcessId
                    Type = if ($p.CommandLine -match '--type=([^\s"]+)') { $Matches[1] } else { 'browser' }
                    WorkingSetBytes = [int64]$g.WorkingSet64
                    PrivateBytes = [int64]$g.PrivateMemorySize64
                  }
                }
              }
            }
            return @($rows)
          }

          foreach ($case in $cases) {
            Write-Host "Testing $($case.Url)"
            $metricsFile = Join-Path $evidence "$($case.Name)-cef-metrics.txt"
            Remove-Item $metricsFile -Force -ErrorAction SilentlyContinue
            $env:DESKTOP_BROWSER_METRICS_FILE = $metricsFile
            $clock = [System.Diagnostics.Stopwatch]::StartNew()
            $proc = Start-Process -FilePath $exe -ArgumentList @("--url=$($case.Url)") -WorkingDirectory $env:BROWSER_DIR -PassThru
            $hwnd = [IntPtr]::Zero
            for ($i=0; $i -lt 90; $i++) {
              Start-Sleep -Milliseconds 500
              $hwnd = [WindowCapture]::FindVisibleWindowForProcess([uint32]$proc.Id)
              if ($hwnd -ne [IntPtr]::Zero) { break }
              if ($proc.HasExited) { throw "Browser process exited before creating a visible window. Exit code: $($proc.ExitCode)" }
            }
            if ($hwnd -eq [IntPtr]::Zero) { throw "No visible top-level window owned by browser PID $($proc.Id) appeared within 45 seconds." }
            $clock.Stop()
            $startupMs = $clock.ElapsedMilliseconds
            [WindowCapture]::SetForegroundWindow($hwnd) | Out-Null
            Start-Sleep -Seconds 2
            [WindowCapture]::Save($hwnd,(Join-Path $evidence "$($case.Name)-startup.bmp"))

            $pageMetric = $null
            for ($i=0; $i -lt 240; $i++) {
              if (Test-Path $metricsFile) {
                $pageMetric = Get-Content $metricsFile | Where-Object { $_ -match '^page_load_ms=' } | Select-Object -Last 1
                if ($pageMetric) { break }
              }
              if ($proc.HasExited) { throw "Browser exited before CEF reported page load for $($case.Url)." }
              Start-Sleep -Milliseconds 500
            }
            if (-not $pageMetric) { throw "No CEF main-frame load timing was reported within 60 seconds for $($case.Url)." }
            [WindowCapture]::Save($hwnd,(Join-Path $evidence "$($case.Name)-loaded.bmp"))

            # Allow short-lived post-load renderer/GPU allocations to settle, then sample the full process tree.
            Start-Sleep -Seconds 3
            $samples = @()
            $processRows = @()
            for ($sample=0; $sample -lt 5; $sample++) {
              $rows = @(Get-BrowserProcessTree -RootPid $proc.Id)
              if ($rows.Count -gt 0) {
                $processRows = $rows
                $samples += [pscustomobject]@{
                  WorkingSet = [int64](($rows | Measure-Object WorkingSetBytes -Sum).Sum)
                  PrivateBytes = [int64](($rows | Measure-Object PrivateBytes -Sum).Sum)
                  RendererWorkingSet = [int64](($rows | Where-Object Type -eq 'renderer' | Measure-Object WorkingSetBytes -Sum).Sum)
                  RendererPrivateBytes = [int64](($rows | Where-Object Type -eq 'renderer' | Measure-Object PrivateBytes -Sum).Sum)
                  ProcessCount = $rows.Count
                }
              }
              Start-Sleep -Seconds 1
            }
            if ($samples.Count -eq 0) { throw "Could not collect browser process-tree memory metrics." }
            $avgWs = [math]::Round((($samples | Measure-Object WorkingSet -Average).Average) / 1MB,1)
            $peakWs = [math]::Round((($samples | Measure-Object WorkingSet -Maximum).Maximum) / 1MB,1)
            $avgPrivate = [math]::Round((($samples | Measure-Object PrivateBytes -Average).Average) / 1MB,1)
            $peakPrivate = [math]::Round((($samples | Measure-Object PrivateBytes -Maximum).Maximum) / 1MB,1)
            $avgRendererWs = [math]::Round((($samples | Measure-Object RendererWorkingSet -Average).Average) / 1MB,1)
            $avgRendererPrivate = [math]::Round((($samples | Measure-Object RendererPrivateBytes -Average).Average) / 1MB,1)
            $processCount = [int](($samples | Measure-Object ProcessCount -Maximum).Maximum)
            $summary += ""
            $summary += "URL: $($case.Url)"
            $summary += "Startup to visible window: $startupMs ms"
            $summary += "CEF page load: $pageMetric"
            $summary += "Browser process-tree working set: average=$avgWs MB; peak=$peakWs MB"
            $summary += "Browser process-tree private bytes: average=$avgPrivate MB; peak=$peakPrivate MB"
            $summary += "Renderer-only memory: working_set_avg=$avgRendererWs MB; private_bytes_avg=$avgRendererPrivate MB"
            $summary += "Browser process count: $processCount"
            $summary += "Browser main PID: $($proc.Id)"
            $summary += "Process breakdown (PID | parent PID | type | working set MB | private MB):"
            foreach ($r in $processRows) {
              $summary += "$($r.Pid) | $($r.ParentPid) | $($r.Type) | $([math]::Round($r.WorkingSetBytes/1MB,1)) | $([math]::Round($r.PrivateBytes/1MB,1))"
            }
            Write-Host "$($case.Name): startup=$startupMs ms; $pageMetric; process_tree_ws_avg=$avgWs MB peak=$peakWs MB; private_avg=$avgPrivate MB; renderers_ws_avg=$avgRendererWs MB; processes=$processCount"

            Get-CimInstance Win32_Process | Where-Object { $_.Name -eq "DesktopBrowser.exe" } |
              ForEach-Object { Stop-Process -Id $_.ProcessId -Force -ErrorAction SilentlyContinue }
            Start-Sleep -Seconds 2
          }
          $summary | Set-Content (Join-Path $evidence "PERFORMANCE_RESULTS.txt")
          $screens = Get-ChildItem $evidence -Filter "*.bmp"
          if ($screens.Count -ne 10) { throw "Expected ten screenshots (startup + loaded for five sites); found $($screens.Count)." }
          foreach ($screen in $screens) {
            if ($screen.Length -lt 10000) { throw "Screenshot is unexpectedly small: $($screen.Name)" }
          }


      - name: Measure Microsoft Edge on the same runner
        shell: pwsh
        timeout-minutes: 20
        run: |
          $ErrorActionPreference = "Stop"
          $edgeCandidates = @(
            "${env:ProgramFiles(x86)}\Microsoft\Edge\Application\msedge.exe",
            "$env:ProgramFiles\Microsoft\Edge\Application\msedge.exe"
          )
          $edgeExe = $edgeCandidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $edgeExe) { throw "Microsoft Edge was not found on this Windows runner." }
          Add-Type -TypeDefinition @'
          using System;
          using System.Runtime.InteropServices;
          public static class EdgeWindowProbe {
            public delegate bool EnumWindowsProc(IntPtr hwnd, IntPtr lParam);
            [DllImport("user32.dll")] static extern bool EnumWindows(EnumWindowsProc callback, IntPtr lParam);
            [DllImport("user32.dll")] static extern uint GetWindowThreadProcessId(IntPtr hwnd, out uint processId);
            [DllImport("user32.dll")] static extern bool IsWindowVisible(IntPtr hwnd);
            public static IntPtr Find(uint pid) {
              IntPtr found=IntPtr.Zero;
              EnumWindows(delegate(IntPtr h,IntPtr s) {
                uint owner; GetWindowThreadProcessId(h,out owner);
                if(owner==pid && IsWindowVisible(h)){found=h;return false;} return true;
              },IntPtr.Zero);
              return found;
            }
          }
          '@
          function Get-Tree([int]$RootPid) {
            $all = @(Get-CimInstance Win32_Process)
            $ids = [System.Collections.Generic.HashSet[int]]::new()
            [void]$ids.Add($RootPid); $changed = $true
            while ($changed) {
              $changed = $false
              foreach ($p in $all) {
                if ($ids.Contains([int]$p.ParentProcessId) -and -not $ids.Contains([int]$p.ProcessId)) {
                  [void]$ids.Add([int]$p.ProcessId); $changed = $true
                }
              }
            }
            foreach ($p in $all) {
              if ($ids.Contains([int]$p.ProcessId)) {
                $g = Get-Process -Id $p.ProcessId -ErrorAction SilentlyContinue
                if ($g) {
                  [pscustomobject]@{
                    Pid=[int]$p.ProcessId; ParentPid=[int]$p.ParentProcessId
                    Type=if($p.CommandLine -match '--type=([^\s"]+)'){$Matches[1]}else{'browser'}
                    WS=[int64]$g.WorkingSet64; Private=[int64]$g.PrivateMemorySize64
                  }
                }
              }
            }
          }
          function Get-CdpPage($Port) {
            for($n=0;$n -lt 60;$n++){
              try {
                $targets=Invoke-RestMethod -Uri "http://127.0.0.1:$Port/json" -TimeoutSec 2
                $page=$targets | Where-Object { $_.type -eq "page" -and $_.webSocketDebuggerUrl } | Select-Object -First 1
                if($page){return $page}
              } catch {}
              Start-Sleep -Milliseconds 500
            }
            throw "Edge DevTools endpoint did not become ready."
          }
          function Invoke-CdpEvaluate($Socket,[int]$Id,[string]$Expression) {
            $payload=@{id=$Id;method="Runtime.evaluate";params=@{expression=$Expression;returnByValue=$true}} | ConvertTo-Json -Depth 8 -Compress
            $bytes=[System.Text.Encoding]::UTF8.GetBytes($payload)
            $segment=[ArraySegment[byte]]::new($bytes)
            $Socket.SendAsync($segment,[System.Net.WebSockets.WebSocketMessageType]::Text,$true,[Threading.CancellationToken]::None).GetAwaiter().GetResult()
            $buffer=New-Object byte[] 65536
            while($true){
              $ms=[System.IO.MemoryStream]::new()
              do {
                $seg=[ArraySegment[byte]]::new($buffer)
                $recv=$Socket.ReceiveAsync($seg,[Threading.CancellationToken]::None).GetAwaiter().GetResult()
                if($recv.MessageType -eq [System.Net.WebSockets.WebSocketMessageType]::Close){throw "Edge DevTools WebSocket closed."}
                $ms.Write($buffer,0,$recv.Count)
              } while(-not $recv.EndOfMessage)
              $msg=[System.Text.Encoding]::UTF8.GetString($ms.ToArray()) | ConvertFrom-Json
              if($msg.id -eq $Id){return $msg}
            }
          }
          $evidence=$env:EVIDENCE_DIR
          $edgeSummary=@(
            "",
            "MICROSOFT EDGE (same Windows Server 2022 x64 runner)",
            "Startup metric: process launch to first visible top-level window owned by Edge's initial process.",
            "Page-load metric: Navigation Timing API loadEventEnd minus navigationStart, read through Edge DevTools Protocol.",
            "Note: Desktop Browser uses CEF OnLoadStart-to-OnLoadEnd; page-load boundaries differ slightly and are reported separately.",
            "Memory metrics: Edge root process plus all descendant processes; working set and private bytes summed across the process tree."
          )
          $caseIndex=0
          foreach($case in @(
            @{Name="example";Url="https://example.com/"},
            @{Name="wikipedia";Url="https://www.wikipedia.org/"},
            @{Name="chatgpt";Url="https://chatgpt.com/"},
            @{Name="github";Url="https://github.com/"},
            @{Name="claude";Url="https://claude.com/"}
          )){
            $caseIndex++; $profile=Join-Path $env:RUNNER_TEMP "EdgeProfile-$caseIndex"; $port=9220+$caseIndex
            $clock=[System.Diagnostics.Stopwatch]::StartNew()
            $edge=Start-Process -FilePath $edgeExe -ArgumentList @("--user-data-dir=$profile","--remote-debugging-port=$port","--no-first-run","--no-default-browser-check","--disable-background-mode",$case.Url) -PassThru
            $hwnd=[IntPtr]::Zero
            for($i=0;$i -lt 90;$i++){
              Start-Sleep -Milliseconds 500; $hwnd=[EdgeWindowProbe]::Find([uint32]$edge.Id)
              if($hwnd -ne [IntPtr]::Zero){break}
              if($edge.HasExited){throw "Edge exited before creating a visible window."}
            }
            if($hwnd -eq [IntPtr]::Zero){throw "Edge did not create a visible window within 45 seconds."}
            $clock.Stop(); $startupMs=$clock.ElapsedMilliseconds
            $target=Get-CdpPage $port
            $socket=[System.Net.WebSockets.ClientWebSocket]::new()
            $socket.Options.KeepAliveInterval=[TimeSpan]::FromSeconds(20)
            $socket.ConnectAsync([Uri]$target.webSocketDebuggerUrl,[Threading.CancellationToken]::None).GetAwaiter().GetResult()
            try {
              $ready=$false; $loadMs=$null
              for($i=0;$i -lt 240;$i++){
                $response=Invoke-CdpEvaluate $socket 1 "(()=>{const n=performance.getEntriesByType('navigation')[0];return {state:document.readyState,loadMs:n&&n.loadEventEnd>0?n.loadEventEnd-n.startTime:null}})()"
                $value=$response.result.result.value
                if($value.state -eq "complete" -and $null -ne $value.loadMs -and [double]$value.loadMs -gt 0){$ready=$true;$loadMs=[math]::Round([double]$value.loadMs,1);break}
                Start-Sleep -Milliseconds 500
              }
              if(-not $ready){throw "Edge did not report a completed navigation timing for $($case.Url)."}
              Start-Sleep -Seconds 3; $samples=@(); $lastRows=@()
              for($s=0;$s -lt 5;$s++){
                $rows=@(Get-Tree -RootPid $edge.Id)
                if($rows.Count -gt 0){
                  $lastRows=$rows
                  $samples += [pscustomobject]@{
                    WS=[int64](($rows|Measure-Object WS -Sum).Sum)
                    Private=[int64](($rows|Measure-Object Private -Sum).Sum)
                    RendererWS=[int64](($rows|Where-Object Type -eq 'renderer'|Measure-Object WS -Sum).Sum)
                    RendererPrivate=[int64](($rows|Where-Object Type -eq 'renderer'|Measure-Object Private -Sum).Sum)
                    Count=$rows.Count
                  }
                }
                Start-Sleep -Seconds 1
              }
              if($samples.Count -eq 0){throw "Could not collect Edge process-tree memory."}
              $avgWs=[math]::Round((($samples|Measure-Object WS -Average).Average)/1MB,1)
              $peakWs=[math]::Round((($samples|Measure-Object WS -Maximum).Maximum)/1MB,1)
              $avgPrivate=[math]::Round((($samples|Measure-Object Private -Average).Average)/1MB,1)
              $peakPrivate=[math]::Round((($sample      - name: Measure Google Chrome on the same runner
        shell: pwsh
        timeout-minutes: 20
        run: |
          $ErrorActionPreference = "Stop"
          $chromeExe = $env:CHROME_EXE
          if (-not (Test-Path $chromeExe)) { throw "Google Chrome executable was not found." }
          Add-Type -TypeDefinition @'
          using System;
          using System.Runtime.InteropServices;
          public static class ChromeWindowProbe {
            public delegate bool EnumWindowsProc(IntPtr hwnd, IntPtr lParam);
            [DllImport("user32.dll")] static extern bool EnumWindows(EnumWindowsProc callback, IntPtr lParam);
            [DllImport("user32.dll")] static extern uint GetWindowThreadProcessId(IntPtr hwnd, out uint processId);
            [DllImport("user32.dll")] static extern bool IsWindowVisible(IntPtr hwnd);
            public static IntPtr Find(uint pid) {
              IntPtr found=IntPtr.Zero;
              EnumWindows(delegate(IntPtr h,IntPtr s) {
                uint owner; GetWindowThreadProcessId(h,out owner);
                if(owner==pid && IsWindowVisible(h)){found=h;return false;} return true;
              },IntPtr.Zero);
              return found;
            }
          }
          '@
          function Get-Tree([int]$RootPid) {
            $all = @(Get-CimInstance Win32_Process)
            $ids = [System.Collections.Generic.HashSet[int]]::new()
            [void]$ids.Add($RootPid); $changed = $true
            while ($changed) {
              $changed = $false
              foreach ($p in $all) {
                if ($ids.Contains([int]$p.ParentProcessId) -and -not $ids.Contains([int]$p.ProcessId)) {
                  [void]$ids.Add([int]$p.ProcessId); $changed = $true
                }
              }
            }
            foreach ($p in $all) {
              if ($ids.Contains([int]$p.ProcessId)) {
                $g = Get-Process -Id $p.ProcessId -ErrorAction SilentlyContinue
                if ($g) {
                  [pscustomobject]@{
                    Pid=[int]$p.ProcessId; ParentPid=[int]$p.ParentProcessId
                    Type=if($p.CommandLine -match '--type=([^\s"]+)'){$Matches[1]}else{'browser'}
                    WS=[int64]$g.WorkingSet64; Private=[int64]$g.PrivateMemorySize64
                  }
                }
              }
            }
          }
          function Get-CdpPage($Port) {
            for($n=0;$n -lt 60;$n++){
              try {
                $targets=Invoke-RestMethod -Uri "http://127.0.0.1:$Port/json" -TimeoutSec 2
                $page=$targets | Where-Object { $_.type -eq "page" -and $_.webSocketDebuggerUrl } | Select-Object -First 1
                if($page){return $page}
              } catch {}
              Start-Sleep -Milliseconds 500
            }
            throw "Chrome DevTools endpoint did not become ready."
          }
          function Invoke-CdpEvaluate($Socket,[int]$Id,[string]$Expression) {
            $payload=@{id=$Id;method="Runtime.evaluate";params=@{expression=$Expression;returnByValue=$true}} | ConvertTo-Json -Depth 8 -Compress
            $bytes=[System.Text.Encoding]::UTF8.GetBytes($payload)
            $segment=[ArraySegment[byte]]::new($bytes)
            $Socket.SendAsync($segment,[System.Net.WebSockets.WebSocketMessageType]::Text,$true,[Threading.CancellationToken]::None).GetAwaiter().GetResult()
            $buffer=New-Object byte[] 65536
            while($true){
              $ms=[System.IO.MemoryStream]::new()
              do {
                $seg=[ArraySegment[byte]]::new($buffer)
                $recv=$Socket.ReceiveAsync($seg,[Threading.CancellationToken]::None).GetAwaiter().GetResult()
                if($recv.MessageType -eq [System.Net.WebSockets.WebSocketMessageType]::Close){throw "Chrome DevTools WebSocket closed."}
                $ms.Write($buffer,0,$recv.Count)
              } while(-not $recv.EndOfMessage)
              $msg=[System.Text.Encoding]::UTF8.GetString($ms.ToArray()) | ConvertFrom-Json
              if($msg.id -eq $Id){return $msg}
            }
          }
          $evidence=$env:EVIDENCE_DIR
          $chromeSummary=@(
            "",
            "GOOGLE CHROME (same Windows Server 2022 x64 runner)",
            "Startup metric: process launch to first visible top-level window owned by Chrome's initial process.",
            "Page-load metric: Navigation Timing API loadEventEnd minus navigationStart, read through Chrome DevTools Protocol.",
            "Note: Desktop Browser uses CEF OnLoadStart-to-OnLoadEnd; page-load boundaries differ slightly and are reported separately.",
            "Memory metrics: Chrome root process plus all descendant processes; working set and private bytes summed across the process tree."
          )
          $caseIndex=0
          foreach($case in @(
            @{Name="example";Url="https://example.com/"},
            @{Name="wikipedia";Url="https://www.wikipedia.org/"},
            @{Name="chatgpt";Url="https://chatgpt.com/"},
            @{Name="github";Url="https://github.com/"},
            @{Name="claude";Url="https://claude.com/"}
          )){
            $caseIndex++; $profile=Join-Path $env:RUNNER_TEMP "ChromeProfile-$caseIndex"; $port=9320+$caseIndex
            $clock=[System.Diagnostics.Stopwatch]::StartNew()
            $chrome=Start-Process -FilePath $chromeExe -ArgumentList @("--user-data-dir=$profile","--remote-debugging-port=$port","--no-first-run","--no-default-browser-check","--disable-background-mode",$case.Url) -PassThru
            $hwnd=[IntPtr]::Zero
            for($i=0;$i -lt 90;$i++){
              Start-Sleep -Milliseconds 500; $hwnd=[ChromeWindowProbe]::Find([uint32]$chrome.Id)
              if($hwnd -ne [IntPtr]::Zero){break}
              if($chrome.HasExited){throw "Chrome exited before creating a visible window."}
            }
            if($hwnd -eq [IntPtr]::Zero){throw "Chrome did not create a visible window within 45 seconds."}
            $clock.Stop(); $startupMs=$clock.ElapsedMilliseconds
            $target=Get-CdpPage $port
            $socket=[System.Net.WebSockets.ClientWebSocket]::new()
            $socket.Options.KeepAliveInterval=[TimeSpan]::FromSeconds(20)
            $socket.ConnectAsync([Uri]$target.webSocketDebuggerUrl,[Threading.CancellationToken]::None).GetAwaiter().GetResult()
            try {
              $ready=$false; $loadMs=$null
              for($i=0;$i -lt 240;$i++){
                $response=Invoke-CdpEvaluate $socket 1 "(()=>{const n=performance.getEntriesByType('navigation')[0];return {state:document.readyState,loadMs:n&&n.loadEventEnd>0?n.loadEventEnd-n.startTime:null}})()"
                $value=$response.result.result.value
                if($value.state -eq "complete" -and $null -ne $value.loadMs -and [double]$value.loadMs -gt 0){$ready=$true;$loadMs=[math]::Round([double]$value.loadMs,1);break}
                Start-Sleep -Milliseconds 500
              }
              if(-not $ready){throw "Chrome did not report a completed navigation timing for $($case.Url)."}
              Start-Sleep -Seconds 3; $samples=@(); $lastRows=@()
              for($s=0;$s -lt 5;$s++){
                $rows=@(Get-Tree -RootPid $chrome.Id)
                if($rows.Count -gt 0){
                  $lastRows=$rows
                  $samples += [pscustomobject]@{
                    WS=[int64](($rows|Measure-Object WS -Sum).Sum)
                    Private=[int64](($rows|Measure-Object Private -Sum).Sum)
                    RendererWS=[int64](($rows|Where-Object Type -eq 'renderer'|Measure-Object WS -Sum).Sum)
                    RendererPrivate=[int64](($rows|Where-Object Type -eq 'renderer'|Measure-Object Private -Sum).Sum)
                    Count=$rows.Count
                  }
                }
                Start-Sleep -Seconds 1
              }
              if($samples.Count -eq 0){throw "Could not collect Chrome process-tree memory."}
              $avgWs=[math]::Round((($samples|Measure-Object WS -Average).Average)/1MB,1)
              $peakWs=[math]::Round((($samples|Measure-Object WS -Maximum).Maximum)/1MB,1)
              $avgPrivate=[math]::Round((($samples|Measure-Object Private -Average).Average)/1MB,1)
              $peakPrivate=[math]::Round((($samples|Measure-Object Private -Maximum).Maximum)/1MB,1)
              $rendererWs=[math]::Round((($samples|Measure-Object RendererWS -Average).Average)/1MB,1)
              $rendererPrivate=[math]::Round((($samples|Measure-Object RendererPrivate -Average).Average)/1MB,1)
              $maxCount=[int](($samples|Measure-Object Count -Maximum).Maximum)
              $chromeSummary += ""; $chromeSummary += "URL: $($case.Url)"
              $chromeSummary += "Startup to visible window: $startupMs ms"
              $chromeSummary += "Chrome Navigation Timing load event: $loadMs ms"
              $chromeSummary += "Browser process-tree working set: average=$avgWs MB; peak=$peakWs MB"
              $chromeSummary += "Browser process-tree private bytes: average=$avgPrivate MB; peak=$peakPrivate MB"
              $chromeSummary += "Renderer-only memory: working_set_avg=$rendererWs MB; private_bytes_avg=$rendererPrivate MB"
              $chromeSummary += "Browser process count (max across samples): $maxCount"
              $chromeSummary += "Process breakdown (last sample; PID | parent PID | type | working set MB | private MB):"
              foreach($r in $lastRows){$chromeSummary += "$($r.Pid) | $($r.ParentPid) | $($r.Type) | $([math]::Round($r.WS/1MB,1)) | $([math]::Round($r.Private/1MB,1))"}
              Write-Host "Chrome $($case.Name): startup=$startupMs ms; load=$loadMs ms; tree WS avg=$avgWs MB; private avg=$avgPrivate MB"
            } finally {
              $socket.Dispose()
              Get-CimInstance Win32_Process | Where-Object { $_.Name -eq "mschrome.exe" -and $_.CommandLine -like "*$profile*" } |
                ForEach-Object { Stop-Process -Id $_.ProcessId -Force -ErrorAction SilentlyContinue }
              Start-Sleep -Seconds 2
            }
          }
          $chromeSummary | Add-Content (Join-Path $evidence "PERFORMANCE_RESULTS.txt")
          $chromeSummary | Set-Content (Join-Path $evidence "CHROME_PERFORMANCE_RESULTS.txt")

      - name: Measure Zen Browser on the same runner
        shell: pwsh
        timeout-minutes: 25
        run: |
          $ErrorActionPreference = "Stop"
          Add-Type -TypeDefinition @'
          using System;
          using System.Runtime.InteropServices;
          public static class ZenWindowProbe {
            public delegate bool EnumWindowsProc(IntPtr hwnd, IntPtr lParam);
            [DllImport("user32.dll")] static extern bool EnumWindows(EnumWindowsProc callback, IntPtr lParam);
            [DllImport("user32.dll")] static extern uint GetWindowThreadProcessId(IntPtr hwnd, out uint processId);
            [DllImport("user32.dll")] static extern bool IsWindowVisible(IntPtr hwnd);
            public static IntPtr Find(uint pid) {
              IntPtr found=IntPtr.Zero;
              EnumWindows(delegate(IntPtr h,IntPtr s) {
                uint owner; GetWindowThreadProcessId(h,out owner);
                if(owner==pid && IsWindowVisible(h)){found=h;return false;} return true;
              },IntPtr.Zero);
              return found;
            }
          }
          '@
          function Get-Tree([int]$RootPid) {
            $all = @(Get-CimInstance Win32_Process)
            $ids = [System.Collections.Generic.HashSet[int]]::new()
            [void]$ids.Add($RootPid); $changed = $true
            while ($changed) {
              $changed = $false
              foreach ($p in $all) {
                if ($ids.Contains([int]$p.ParentProcessId) -and -not $ids.Contains([int]$p.ProcessId)) {
                  [void]$ids.Add([int]$p.ProcessId); $changed = $true
                }
              }
            }
            foreach ($p in $all) {
              if ($ids.Contains([int]$p.ProcessId)) {
                $g = Get-Process -Id $p.ProcessId -ErrorAction SilentlyContinue
                if ($g) {
                  [pscustomobject]@{
                    Pid=[int]$p.ProcessId; ParentPid=[int]$p.ParentProcessId
                    Type=if($p.CommandLine -match '-contentproc'){'content'}else{'browser'}
                    WS=[int64]$g.WorkingSet64; Private=[int64]$g.PrivateMemorySize64
                  }
                }
              }
            }
          }
          $driver = Start-Process -FilePath (Get-Command geckodriver).Source -ArgumentList @("--host","127.0.0.1","--port","4444") -PassThru
          try {
            $driverReady = $false
            for($i=0;$i -lt 40;$i++){
              try { Invoke-RestMethod -Uri "http://127.0.0.1:4444/status" -TimeoutSec 2 | Out-Null; $driverReady=$true; break } catch { Start-Sleep -Milliseconds 500 }
            }
            if(-not $driverReady){throw "GeckoDriver did not become ready."}
            $evidence=$env:EVIDENCE_DIR
            $zenSummary=@(
              "",
              "ZEN BROWSER (same Windows Server 2022 x64 runner)",
              "Startup metric: WebDriver session launch request to first visible Zen window.",
              "Page-load metric: Navigation Timing API loadEventEnd minus navigationStart, read through Firefox WebDriver.",
              "Memory metrics: Zen root process plus all descendant processes; working set and private bytes summed across the process tree.",
              "Zen uses the Firefox/Gecko engine and is automated with GeckoDriver, not Chromium DevTools."
            )
            $caseIndex=0
            foreach($case in @(
              @{Name="example";Url="https://example.com/"},
              @{Name="wikipedia";Url="https://www.wikipedia.org/"},
              @{Name="chatgpt";Url="https://chatgpt.com/"},
              @{Name="github";Url="https://github.com/"},
              @{Name="claude";Url="https://claude.com/"}
            )){
              $caseIndex++
              $profile=Join-Path $env:RUNNER_TEMP "ZenProfile-$caseIndex"
              New-Item -ItemType Directory -Force -Path $profile | Out-Null
              $body=@{capabilities=@{alwaysMatch=@{browserName="firefox";"moz:firefoxOptions"=@{binary=$env:ZEN_EXE;args=@("-no-remote","-profile",$profile)}}}} | ConvertTo-Json -Depth 12
              $clock=[System.Diagnostics.Stopwatch]::StartNew()
              $session=Invoke-RestMethod -Method Post -Uri "http://127.0.0.1:4444/session" -ContentType "application/json" -Body $body -TimeoutSec 120
              $sessionId=$session.value.sessionId
              if(-not $sessionId){throw "GeckoDriver did not return a Zen WebDriver session."}
              $zenProc=Get-CimInstance Win32_Process | Where-Object { $_.Name -eq "zen.exe" } | Sort-Object CreationDate -Descending | Select-Object -First 1
              if(-not $zenProc){throw "Zen process was not found after WebDriver launch."}
              $hwnd=[IntPtr]::Zero
              for($i=0;$i -lt 90;$i++){
                $hwnd=[ZenWindowProbe]::Find([uint32]$zenProc.ProcessId)
                if($hwnd -ne [IntPtr]::Zero){break}
                Start-Sleep -Milliseconds 500
              }
              if($hwnd -eq [IntPtr]::Zero){throw "Zen did not create a visible window within 45 seconds."}
              $clock.Stop(); $startupMs=$clock.ElapsedMilliseconds
              try {
                Invoke-RestMethod -Method Post -Uri "http://127.0.0.1:4444/session/$sessionId/url" -ContentType "application/json" -Body (@{url=$case.Url}|ConvertTo-Json) -TimeoutSec 180 | Out-Null
                $ready=$false; $loadMs=$null
                for($i=0;$i -lt 240;$i++){
                  $scriptBody=@{script="(()=>{const n=performance.getEntriesByType('navigation')[0];return {state:document.readyState,loadMs:n&&n.loadEventEnd>0?n.loadEventEnd-n.startTime:null}})()";args=@()}|ConvertTo-Json -Depth 6
                  $result=Invoke-RestMethod -Method Post -Uri "http://127.0.0.1:4444/session/$sessionId/execute/sync" -ContentType "application/json" -Body $scriptBody -TimeoutSec 15
                  $value=$result.value
                  if($value.state -eq "complete" -and $null -ne $value.loadMs -and [double]$value.loadMs -gt 0){$ready=$true;$loadMs=[math]::Round([double]$value.loadMs,1);break}
                  Start-Sleep -Milliseconds 500
                }
                if(-not $ready){throw "Zen did not report a completed navigation timing for $($case.Url)."}
                Start-Sleep -Seconds 3; $samples=@(); $lastRows=@()
                for($s=0;$s -lt 5;$s++){
                  $rows=@(Get-Tree -RootPid ([int]$zenProc.ProcessId))
                  if($rows.Count -gt 0){
                    $lastRows=$rows
                    $samples += [pscustomobject]@{
                      WS=[int64](($rows|Measure-Object WS -Sum).Sum)
                      Private=[int64](($rows|Measure-Object Private -Sum).Sum)
                      RendererWS=[int64](($rows|Where-Object Type -eq 'content'|Measure-Object WS -Sum).Sum)
                      RendererPrivate=[int64](($rows|Where-Object Type -eq 'content'|Measure-Object Private -Sum).Sum)
                      Count=$rows.Count
                    }
                  }
                  Start-Sleep -Seconds 1
                }
                if($samples.Count -eq 0){throw "Could not collect Zen process-tree memory."}
                $avgWs=[math]::Round((($samples|Measure-Object WS -Average).Average)/1MB,1)
                $peakWs=[math]::Round((($samples|Measure-Object WS -Maximum).Maximum)/1MB,1)
                $avgPrivate=[math]::Round((($samples|Measure-Object Private -Average).Average)/1MB,1)
                $peakPrivate=[math]::Round((($samples|Measure-Object Private -Maximum).Maximum)/1MB,1)
                $rendererWs=[math]::Round((($samples|Measure-Object RendererWS -Average).Average)/1MB,1)
                $rendererPrivate=[math]::Round((($samples|Measure-Object RendererPrivate -Average).Average)/1MB,1)
                $maxCount=[int](($samples|Measure-Object Count -Maximum).Maximum)
                $zenSummary += ""; $zenSummary += "URL: $($case.Url)"
                $zenSummary += "Startup to visible window: $startupMs ms"
                $zenSummary += "Zen Navigation Timing load event: $loadMs ms"
                $zenSummary += "Browser process-tree working set: average=$avgWs MB; peak=$peakWs MB"
                $zenSummary += "Browser process-tree private bytes: average=$avgPrivate MB; peak=$peakPrivate MB"
                $zenSummary += "Content-process-only memory: working_set_avg=$rendererWs MB; private_bytes_avg=$rendererPrivate MB"
                $zenSummary += "Browser process count (max across samples): $maxCount"
                $zenSummary += "Process breakdown (last sample; PID | parent PID | type | working set MB | private MB):"
                foreach($r in $lastRows){$zenSummary += "$($r.Pid) | $($r.ParentPid) | $($r.Type) | $([math]::Round($r.WS/1MB,1)) | $([math]::Round($r.Private/1MB,1))"}
                Write-Host "Zen $($case.Name): startup=$startupMs ms; load=$loadMs ms; tree WS avg=$avgWs MB; private avg=$avgPrivate MB"
              } finally {
                Invoke-RestMethod -Method Delete -Uri "http://127.0.0.1:4444/session/$sessionId" -TimeoutSec 30 | Out-Null
                Get-CimInstance Win32_Process | Where-Object { $_.Name -eq "zen.exe" -and $_.CommandLine -like "*$profile*" } |
                  ForEach-Object { Stop-Process -Id $_.ProcessId -Force -ErrorAction SilentlyContinue }
                Start-Sleep -Seconds 2
              }
            }
            $zenSummary | Add-Content (Join-Path $evidence "PERFORMANCE_RESULTS.txt")
            $zenSummary | Set-Content (Join-Path $evidence "ZEN_PERFORMANCE_RESULTS.txt")
          } finally {
            Stop-Process -Id $driver.Id -Force -ErrorAction SilentlyContinue
          }

