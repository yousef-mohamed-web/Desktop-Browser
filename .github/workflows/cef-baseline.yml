name: CEF Windows x64 Baseline

on:
  push:
    branches:
      - "build/**"
    paths:
      - ".github/workflows/cef-baseline.yml"
      - "BUILDING.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cef-baseline-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-cefsimple:
    name: Build official CEF sample (Windows x64)
    runs-on: windows-2022
    timeout-minutes: 45

    env:
      CEF_VERSION: "156.0.14+g4fa4ab5+chromium-156.0.8078.48"
      CEF_PLATFORM: "windows64"

    steps:
      - name: Check out project
        uses: actions/checkout@v4

      - name: Show build environment
        shell: pwsh
        run: |
          cmake --version
          cmake --help
          Get-ChildItem Env:VCToolsInstallDir, Env:WindowsSdkDir -ErrorAction SilentlyContinue

      - name: Download and verify official CEF binary distribution
        shell: pwsh
        run: |
          $archiveName = "cef_binary_$($env:CEF_VERSION)_$($env:CEF_PLATFORM).tar.bz2"
          $encodedName = [Uri]::EscapeDataString($archiveName)
          $baseUrl = "https://cef-builds.spotifycdn.com/$encodedName"
          $archivePath = Join-Path $env:RUNNER_TEMP $archiveName
          $hashPath = "$archivePath.sha1"

          Write-Host "Downloading CEF checksum..."
          Invoke-WebRequest -Uri "$baseUrl.sha1" -OutFile $hashPath

          $expectedHash = (Get-Content $hashPath -Raw).Trim().Split()[0].ToLowerInvariant()
          if ($expectedHash -notmatch '^[a-f0-9]{40}$') {
            throw "The CEF SHA1 sidecar did not contain a valid SHA1 checksum."
          }

          Write-Host "Downloading CEF binary distribution (approximately 350 MB)..."
          Invoke-WebRequest -Uri $baseUrl -OutFile $archivePath

          $actualHash = (Get-FileHash -Path $archivePath -Algorithm SHA1).Hash.ToLowerInvariant()
          if ($actualHash -ne $expectedHash) {
            throw "CEF archive checksum mismatch. Expected $expectedHash, got $actualHash."
          }

          "CEF_ARCHIVE=$archivePath" | Out-File -FilePath $env:GITHUB_ENV -Append
          Write-Host "CEF archive checksum verified."

      - name: Extract CEF distribution
        shell: pwsh
        run: |
          $extractRoot = Join-Path $env:RUNNER_TEMP "cef"
          New-Item -ItemType Directory -Force -Path $extractRoot | Out-Null
          tar -xjf $env:CEF_ARCHIVE -C $extractRoot

          $cefRoot = Join-Path $extractRoot "cef_binary_$($env:CEF_VERSION)_$($env:CEF_PLATFORM)"
          if (-not (Test-Path (Join-Path $cefRoot "CMakeLists.txt"))) {
            throw "The extracted CEF distribution does not contain CMakeLists.txt."
          }

          "CEF_ROOT=$cefRoot" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Configure official CEF sample for x64
        shell: pwsh
        run: |
          $buildDir = Join-Path $env:CEF_ROOT "build"
          cmake -S $env:CEF_ROOT -B $buildDir -G "Visual Studio 17 2022" -A x64

      - name: Build cefsimple in Release x64
        shell: pwsh
        run: |
          cmake --build (Join-Path $env:CEF_ROOT "build") --config Release --target cefsimple --parallel 2

      - name: Stage and verify build output
        shell: pwsh
        run: |
          $matches = Get-ChildItem -Path $env:CEF_ROOT -Filter "cefsimple.exe" -File -Recurse |
            Where-Object { $_.FullName -match '[\\/]Release[\\/]cefsimple\.exe$' } |
            Select-Object -First 1

          if (-not $matches) {
            throw "cefsimple.exe was not found in a Release output directory."
          }

          $stage = Join-Path $env:RUNNER_TEMP "DesktopBrowser-CEF-Baseline"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item -Path (Join-Path $matches.DirectoryName "*") -Destination $stage -Recurse -Force

          if (-not (Test-Path (Join-Path $stage "cefsimple.exe"))) {
            throw "The staged CEF executable is missing."
          }

          Get-ChildItem $stage | Select-Object Name, Length
          "CEF_STAGE=$stage" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Upload Windows x64 baseline artifact
        uses: actions/upload-artifact@v4
        with:
          name: cef-windows-x64-baseline
          path: ${{ runner.temp }}/DesktopBrowser-CEF-Baseline/
          if-no-files-found: error
          retention-days: 7
